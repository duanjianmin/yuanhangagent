<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>远航实业员工助手</title>
<style>
  :root { --line: #dfe3e8; --muted: #6b7480; --accent: #1f6feb; --bg: #f5f6f8; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.6 "Microsoft YaHei", "PingFang SC", sans-serif; background: var(--bg); color: #1c2128; }
  .app { max-width: 780px; height: 100vh; margin: 0 auto; display: flex; flex-direction: column; background: #fff; border-inline: 1px solid var(--line); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; flex: 1; }
  select, button, input { font: inherit; }
  select { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 86%; padding: 9px 13px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: var(--accent); color: #fff; }
  .bot { align-self: flex-start; background: var(--bg); }
  .steps { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  .steps div::before { content: "· "; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .confirm { margin-top: 8px; padding: 10px; border: 1px solid #e3b341; border-radius: 8px; background: #fff8e5; }
  .confirm button { margin: 8px 8px 0 0; padding: 4px 16px; border-radius: 6px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  .confirm button.yes { background: var(--accent); border-color: var(--accent); color: #fff; }
  .error { color: #cf222e; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  form input { flex: 1; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; outline: none; }
  form input:focus { border-color: var(--accent); }
  form button { padding: 0 20px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  form button:disabled, form input:disabled { opacity: .5; cursor: not-allowed; }
  .hints { padding: 0 16px 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .hints button { font-size: 12.5px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 14px; background: #fff; color: var(--muted); cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>远航实业员工助手 · 小远</h1>
    <label>当前账号 <select id="employee"></select></label>
    <button id="reset" type="button" title="开始一段新的对话">新对话</button>
  </header>
  <div id="log"></div>
  <div class="hints" id="hints"></div>
  <form id="form">
    <input id="input" placeholder="问制度、查年假和报销、请假、报修、订会议室……" autocomplete="off">
    <button id="send">发送</button>
  </form>
</div>
<script>
const $ = id => document.getElementById(id);
const INTENTS = {knowledge: "制度问答", personal: "个人查询", action: "事务办理", complex: "复合任务", other: "闲聊"};
const HINTS = ["年假没休完可以留到明年吗", "我还剩几天年假", "帮我请这周五一天年假",
               "VPN 报错 E-809，帮我报个修", "我下周三去上海出差两天，帮我安排一下"];
let sessionId = newSession();

function newSession() { return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function add(cls, text = "") {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  $("log").append(el);
  $("log").scrollTop = $("log").scrollHeight;
  return el;
}

function setBusy(busy) { $("input").disabled = $("send").disabled = busy; if (!busy) $("input").focus(); }

// 读取 SSE：服务端的每个事件是一行 "data: {JSON}"，事件之间用空行分隔
async function stream(url, body, onEvent) {
  const response = await fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json", "X-Emp-Id": $("employee").value},
    body: JSON.stringify(body),
  });
  if (!response.ok) {
    const detail = await response.json().catch(() => ({}));
    return onEvent({type: "error", message: detail.detail || `请求失败（${response.status}）`});
  }
  const reader = response.body.getReader(), decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const {value, done} = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, {stream: true});
    const parts = buffer.split("\n\n");
    buffer = parts.pop();
    for (const part of parts) if (part.startsWith("data: ")) onEvent(JSON.parse(part.slice(6)));
  }
}

// 一条助手消息由三部分组成：步骤、正文、附注
function botMessage() {
  const el = add("bot");
  el.innerHTML = '<div class="steps"></div><div class="text"></div><div class="meta"></div>';
  return {el, steps: el.children[0], text: el.children[1], meta: el.children[2]};
}

async function run(url, body, view = botMessage()) {
  setBusy(true);
  let waiting = false;
  const step = text => { const d = document.createElement("div"); d.textContent = text; view.steps.append(d); };
  try {
    await stream(url, body, event => {
      if (event.type === "intent") step(`意图：${INTENTS[event.intent] || event.intent}`);
      else if (event.type === "step") step(event.text);
      else if (event.type === "token") view.text.textContent += event.text;
      else if (event.type === "retract") view.text.textContent = "";
      else if (event.type === "confirm") { waiting = true; askConfirm(view, event); }
      else if (event.type === "done") {
        const u = event.usage;
        view.meta.textContent = `用时 ${event.seconds.toFixed(1)} 秒 · 路由模型 ${u.router.calls} 次 · ` +
          `主力模型 ${u.worker.calls} 次（输入 ${u.worker.input_tokens}，其中缓存命中 ${u.worker.cached_tokens}；输出 ${u.worker.output_tokens}）· 约 ${event.cost.toFixed(4)} 元`;
      } else if (event.type === "error") { view.text.classList.add("error"); view.text.textContent = event.message; }
      $("log").scrollTop = $("log").scrollHeight;
    });
  } catch (error) {
    view.text.classList.add("error");
    view.text.textContent = "连接中断：" + error.message;
  }
  if (!waiting) setBusy(false);
}

function askConfirm(view, event) {
  const box = document.createElement("div");
  box.className = "confirm";
  box.innerHTML = '<div></div><button class="yes">确认</button><button>取消</button>';
  box.children[0].textContent = `即将${event.summary}。确认吗？`;
  const decide = approved => {
    box.remove();
    view.steps.append(Object.assign(document.createElement("div"), {textContent: approved ? "已确认" : "已取消"}));
    run("/api/confirm", {session_id: sessionId, approved}, view);
  };
  box.children[1].onclick = () => decide(true);
  box.children[2].onclick = () => decide(false);
  view.el.append(box);
}

function send(message) {
  if (!message || $("send").disabled) return;
  add("user", message);
  $("input").value = "";
  run("/api/chat", {session_id: sessionId, message});
}

function reset() { sessionId = newSession(); $("log").innerHTML = ""; setBusy(false); }

$("form").onsubmit = event => { event.preventDefault(); send($("input").value.trim()); };
$("reset").onclick = reset;
$("employee").onchange = reset;      // 换账号就是换一个人，对话从头开始
for (const hint of HINTS) {
  const button = Object.assign(document.createElement("button"), {type: "button", textContent: hint});
  button.onclick = () => send(hint);
  $("hints").append(button);
}
fetch("/api/employees").then(r => r.json()).then(list => {
  for (const e of list) $("employee").append(new Option(`${e.name}（${e.emp_id}，${e.department}）`, e.emp_id));
});
</script>
</body>
</html>
